# █▄░█ █░█ █ █▀▄ █ ▄▀█
# █░▀█ ▀▄▀ █ █▄▀ █ █▀█
# Optimizador: Hyprland + NVIDIA Open 610+ @ 100Hz

# -----------------------------------------------------------------
# Variables Core del Ecosistema NVIDIA
# -----------------------------------------------------------------
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GBM_BACKEND,nvidia-drm

# Aceleración de Video por Hardware (Obligatorio para RTX 3060)
# Descarga el procesamiento de video del Ryzen 5 a los tensores de la GPU.
env = NVD_BACKEND,direct 

# -----------------------------------------------------------------
# Integración Estricta con Wayland (Prevención de XWayland Stuttering)
# -----------------------------------------------------------------
env = XDG_SESSION_TYPE,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = OZONE_PLATFORM,wayland
env = MOZ_ENABLE_WAYLAND,1

# -----------------------------------------------------------------
# Persistencia de Caché de Sombreadores (Overwatch / DXVK / Vulkan)
# -----------------------------------------------------------------
env = __GL_SHADER_DISK_CACHE_PATH,~/.cache/nvidia/glcache
env = __GL_SHADER_DISK_CACHE_SIZE,53687091200
env = __GL_SHADER_DISK_CACHE_SKIP_CLEANUP,1
env = DXVK_STATE_CACHE_PATH,~/.cache/nvidia/dxvk
env = VK_ICD_FILENAMES,/usr/share/vulkan/icd.d/nvidia_icd.json

# -----------------------------------------------------------------
# Renderizado y Mitigación de Desincronización (Flickering)
# -----------------------------------------------------------------
# Los cursores por hardware aún pueden presentar anomalías en transiciones rápidas.
cursor:no_hardware_cursors = true

render {
    # Aprovecha la arquitectura de los drivers 610+ para sincronización de frames exacta.
    # Elimina el flickering residual en aplicaciones XWayland que aún lo requieran.
    explicit_sync = 1
    explicit_sync_kms = 1
}